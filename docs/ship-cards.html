<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Battles Ship Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Pixel-art card style: square corners, notched pixel borders (box-shadow), hard shadows,
     pixel fonts, and every picture drawn from pixel grids (no smooth shapes). */
  :root {
    --bg: #070a14;
    --card: #111a2e;
    --panel: #18233d;
    --panel-dark: #0c1426;
    --edge: #31507f;
    --text: #e8f0ff;
    --muted: #8ea2c8;
    --accent: #66e8ff;
    --gold: #ffd43b;
    --hull: #e03131;
    --shield: #66e8ff;
    --good: #69db7c;
    --cream: #f4ecd8;
    --ink: #0b1222;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg);
    font-family: 'Pixelify Sans', system-ui, sans-serif; color: var(--text); padding: 20px 16px 40px;
  }
  img, canvas, .pxi { image-rendering: pixelated; image-rendering: crisp-edges; }
  /* Notched pixel border drawn outside the box. Set --pc for the color, --b for the thickness. */
  .px {
    --b: 3px;
    box-shadow: calc(-1 * var(--b)) 0 0 0 var(--pc, var(--edge)), var(--b) 0 0 0 var(--pc, var(--edge)),
                0 calc(-1 * var(--b)) 0 0 var(--pc, var(--edge)), 0 var(--b) 0 0 var(--pc, var(--edge));
  }
  .sil { font-family: 'Silkscreen', monospace; }

  header { max-width: 1400px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 24px; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; padding: 3px; }
  .filters button {
    font-family: 'Silkscreen', monospace; font-size: 13px; padding: 5px 10px; border: 0;
    background: var(--panel); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .filters button.on { --pc: var(--gold); color: var(--gold); }

  .faction-title { max-width: 1400px; margin: 28px auto 14px; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .faction-title small { font-family: 'Pixelify Sans', sans-serif; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 15px; }
  .grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 28px; align-items: start; padding: 6px; }

  .card {
    --fc: var(--accent);
    --pc: var(--fc); --b: 4px;
    background: var(--card); scroll-margin-top: 16px; position: relative;
  }
  .card::after { content: ''; position: absolute; inset: 0; transform: translate(10px, 10px); background: #000; opacity: .55; z-index: -1; }
  .card:target { --pc: var(--gold); }

  .art { position: relative; background: #050810; line-height: 0; }
  .art .scene { width: 100%; display: block; }
  .faction { position: absolute; top: 9px; left: 9px; display: flex; align-items: center; gap: 6px; padding: 3px 7px 3px 4px; background: rgba(5,8,16,.85); --pc: var(--fc); --b: 2px; font-family: 'Silkscreen', monospace; font-size: 11px; line-height: 1; color: var(--fc); text-transform: uppercase; }
  .cost { position: absolute; top: 9px; right: 9px; min-width: 46px; padding: 4px 6px 3px; background: var(--ink); --pc: var(--gold); text-align: center; line-height: 1; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 20px; color: var(--gold); }
  .cost small { display: block; font-size: 8px; font-weight: 400; margin-top: 2px; }
  .titlebar { display: flex; align-items: center; gap: 10px; margin: -16px 14px 0; position: relative; background: var(--cream); --pc: var(--ink); padding: 6px 12px; color: var(--ink); }
  .titlebar::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #c4b99f; }
  .emblem { flex: none; background: var(--ink); padding: 3px; line-height: 0; }
  .titlebar h2 { margin: 0; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 20px; letter-spacing: .5px; line-height: 1.05; }
  .titlebar .class { font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #4a5a7a; }

  .body { padding: 14px 12px 12px; display: grid; gap: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); padding: 8px 10px; }
  .panel h3 { margin: 0 0 6px; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stat { background: var(--panel); padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .stat .k { font-family: 'Silkscreen', monospace; font-size: 10px; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; gap: 4px; }
  .stat.power { --pc: var(--gold); }
  .stat.power .v { color: var(--gold); }

  .zones { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; gap: 6px 4px; padding: 2px; }
  .zones .ship { grid-column: 2; grid-row: 2; }
  .sb { display: flex; align-items: baseline; gap: 3px; background: var(--panel-dark); --pc: var(--shield); --b: 2px; padding: 1px 6px; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 14px; color: var(--shield); }
  .sb.zero { --pc: #3c4c6a; color: #4d5f80; }
  .sb span { font-size: 8px; font-weight: 400; color: var(--muted); }
  .z-front { grid-column: 2; grid-row: 1; } .z-left { grid-column: 1; grid-row: 2; } .z-right { grid-column: 3; grid-row: 2; } .z-rear { grid-column: 2; grid-row: 3; }
  .hull { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .hull .num { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 24px; color: var(--hull); min-width: 30px; text-align: center; }
  .hull .label { font-family: 'Silkscreen', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .pips { display: flex; flex-wrap: wrap; gap: 2px; }
  .pip { width: 8px; height: 12px; background: var(--hull); box-shadow: inset 0 3px 0 #ff8787, inset 0 -2px 0 #a61e1e; }

  .maneuver table { border-collapse: separate; border-spacing: 3px; width: 100%; }
  .maneuver th { font-family: 'Silkscreen', monospace; font-size: 10px; color: var(--muted); font-weight: 400; }
  .maneuver thead th { font-size: 13px; color: var(--text); font-weight: 700; }
  .maneuver td { height: 20px; text-align: center; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 13px; }
  .maneuver td.on { background: #123524; color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }
  .maneuver td.off { background: repeating-conic-gradient(rgba(255,255,255,.05) 0 25%, transparent 0 50%) 0 0 / 4px 4px; }
  .note, .legend { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.2; }

  .weapons .head { display: flex; justify-content: space-between; align-items: baseline; }
  .weapons .head small { font-size: 13px; color: var(--muted); }
  .weapons .head small b { color: var(--text); font-family: 'Silkscreen', monospace; }
  .weapons table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .weapons th { font-family: 'Silkscreen', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 400; text-align: center; padding: 0 2px 3px; }
  .weapons th:first-child { text-align: left; }
  .weapons td { padding: 5px 2px; text-align: center; border-top: 2px dotted #2a3d63; vertical-align: middle; }
  .weapons td.name { text-align: left; font-weight: 600; line-height: 1.05; }
  .kw { display: inline-block; margin: 3px 4px 0 0; font-family: 'Silkscreen', monospace; font-size: 8px; text-transform: uppercase; padding: 1px 4px; color: var(--ink); background: var(--shield); }
  .arc { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  .reach { display: inline-flex; gap: 2px; }
  .reach i { width: 7px; height: 7px; box-shadow: inset 0 0 0 2px var(--accent); }
  .reach i.on { background: var(--accent); }
  .dmg { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .dmg.ion { color: var(--shield); }
  .dmg .pxi { vertical-align: -2px; }
  .pill { display: inline-block; min-width: 26px; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--gold); padding: 1px 5px; box-shadow: inset 0 -2px 0 #e09f00; }
  tr.pd td { color: var(--muted); }
  tr.pd .pill { background: transparent; color: var(--good); box-shadow: inset 0 0 0 2px var(--good); font-size: 9px; padding: 3px 5px; }
  .legend b { color: var(--text); font-weight: 600; }

  .ability { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
  .ability + .ability { border-top: 2px dotted #2a3d63; }
  .ability .icon { flex: none; width: 30px; height: 30px; background: var(--panel-dark); --pc: var(--gold); --b: 2px; display: grid; place-items: center; margin: 2px; }
  .ability p { margin: 0; font-size: 15px; line-height: 1.2; }
  .ability strong { color: var(--gold); font-weight: 600; }
  .ability .tag { font-family: 'Silkscreen', monospace; font-size: 8px; color: var(--muted); text-transform: uppercase; margin-left: 4px; }
  .stances { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px; }
  .stance { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 500; padding: 2px 7px 2px 4px; background: var(--panel-dark); --b: 2px; }
  .footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 14px 12px; font-size: 15px; color: var(--muted); }
  .ratings { display: flex; gap: 8px; flex: none; font-family: 'Silkscreen', monospace; font-size: 11px; }
  .ratings span b { color: var(--text); margin-left: 1px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Space Battles · Ship Cards</h1>
    <p>Every ship in the game, straight from the game's own data.</p>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="cards"><p style="text-align:center;color:var(--muted)">Loading…</p></main>

<script type="module">
import {
  FACTIONS, FACTION_ORDER, SHIPS, WEAPONS, CLASSES, RANGE_BANDS, ARC_DEFS, HIT, SPECIALS, SQUADRONS,
  STANCES, STANCE_ORDER,
} from '../js/games/space-battles/data.js';
import { SPRITES, PALETTE } from '../js/games/space-battles/sprites.js';

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BAND = Object.fromEntries(RANGE_BANDS.map((b, i) => [b.id, i]));

// Faction traits shown on every ship of that faction.
const TRAITS = {
  protectorate: () => [],
  djnzuar: () => [
    { icon: '💥', name: 'Ramming', text: 'Colliding with an enemy ship deals it 3 damage; this ship takes 1.' },
    { icon: '🔧', name: 'Samurai Engineers', text: 'Damage Control restores 3 shields or 1 hull, and also removes 1 critical.' },
  ],
  pirates: () => [
    { icon: '🚀', name: 'Every Ship Is Home', text: 'The first time it drops to half hull, it gets a free Full Burn move next round.' },
  ],
};

// ---------- Pixel helpers ----------

// A letter grid as a crisp SVG (one letter = one pixel, '.' = empty).
function pxSVG(rows, pal, scale = 2) {
  const h = rows.length, w = Math.max(...rows.map((r) => r.length));
  let rects = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const c = row[x];
      if (!pal[c]) { x++; continue; }
      let e = x;
      while (e < row.length && row[e] === c) e++;
      rects += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${pal[c]}"/>`;
      x = e;
    }
  });
  return `<svg class="pxi" width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

// Faction badges.
const BADGES = {
  // Shield with a star.
  protectorate: { pal: { k: '#0b1222', W: '#f4ecd8', b: '#2f5aa8', l: '#4d7fd6', Y: '#ffd43b' }, rows: [
    'kkkkkkkkkkkkkkk',
    'kWWWWWWWWWWWWWk',
    'kWlllllYlllllWk',
    'kWlbbbbYbbbbbWk',
    'kWbbbbYYYbbbbWk',
    'kWbYYYYYYYYYbWk',
    'kWbbYYYYYYYbbWk',
    'kWbbbYYYYYbbbWk',
    'kWbbbYYbYYbbbWk',
    'kWbbYYbbbYYbbWk',
    '.kWbbbbbbbbbWk.',
    '.kWbbbbbbbbbWk.',
    '..kWbbbbbbbWk..',
    '...kWbbbbbWk...',
    '....kWbbbWk....',
    '.....kWWWk.....',
    '......kkk......',
  ] },
  // Dino head in profile, facing right, with crest spikes, magenta eye and teeth.
  djnzuar: { pal: { k: '#1c0f08', H: '#c9652c', h: '#9c4a1f', L: '#e8894d', M: '#ff2eb8', T: '#f4ecd8' }, rows: [
    '...k.k.k........',
    '..kHkHkHkkkk....',
    '.kHLLLLLLLLHkk..',
    '.kHHHHHHHMMHHHk.',
    'kHhHHHHHHMMHHHHk',
    'kHhHHHHHHHHHHHHk',
    'kHhhHHHHHkkkkkkk',
    'kHhhHHHHkTkTkTk.',
    'kHhhhHHHk.......',
    'kHhhhHHHkTkTkk..',
    'kHhhhhHHHHHHHk..',
    '.kHhhhhkkkkkk...',
    '.kHhhhk.........',
    '.kkkkk..........',
  ] },
  // Skull (pirates have no badge design yet).
  pirates: { pal: { k: '#0b1222', W: '#f4ecd8', w: '#c4b99f' }, rows: [
    '...kkkkkkk...',
    '..kWWWWWWWk..',
    '.kWWWWWWWWWk.',
    '.kWWWWWWWWWk.',
    '.kWkkWWWkkWk.',
    '.kWkkWWWkkWk.',
    '.kWWWWkWWWWk.',
    '..kwWWWWWwk..',
    '...kWkWkWk...',
    '...kkkkkkk...',
  ] },
};
const badge = (fid, scale) => pxSVG(BADGES[fid].rows, BADGES[fid].pal, scale);

const BOLT = pxSVG([
  '...YYk',
  '..YYk.',
  '.YYk..',
  'YYYYYk',
  '..YYk.',
  '.YYk..',
  'YYk...',
], { Y: '#ffd43b', k: '#e09f00' }, 2);
const ION = pxSVG([
  'CCCCC',
  'CkCkC',
  'CCCCC',
  'CkCkC',
  '.CCC.',
  '..C..',
], { C: '#66e8ff', k: '#0b1222' }, 2);

// Arc icons: an 11×11 pixel circle, ship in the middle pointing up, the arc filled in.
const ARC_COLOR = { battery: '#66e8ff', spinal: '#ffd43b', turret: '#69db7c' };
function arcIcon(arc) {
  const rows = [];
  for (let y = 0; y < 11; y++) {
    let row = '';
    for (let x = 0; x < 11; x++) {
      const dx = x - 5, dy = y - 5, d = Math.hypot(dx, dy);
      const ang = Math.abs(Math.atan2(dx, -dy) * 180 / Math.PI);
      const inArc = arc === 'turret' || (arc === 'battery' ? ang <= 135 : ang <= 20);
      if ((x === 5 && y === 4) || (y === 5 && x >= 4 && x <= 6)) row += 'S';
      else if (d > 5.4) row += '.';
      else if (d > 4.3) row += inArc ? 'A' : 'r';
      else row += inArc ? 'a' : '.';
    }
    rows.push(row);
  }
  const c = ARC_COLOR[arc];
  return `<span class="arc">${pxSVG(rows, { A: c, a: c + '55', r: '#31507f', S: '#ffffff' }, 2)}${ARC_DEFS[arc].name}</span>`;
}

// Emoji/symbol drawn tiny on a canvas and blown up, so it turns into chunky pixels.
const emojiCache = {};
function pxEmoji(ch, show = 24, res = 12) {
  const key = `${ch}|${show}|${res}`;
  if (!emojiCache[key]) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = res;
    const ctx = cv.getContext('2d');
    ctx.font = `${res}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd43b';
    ctx.fillText(ch, res / 2, res / 2 + 1);
    const img = ctx.getImageData(0, 0, res, res);
    for (let i = 3; i < img.data.length; i += 4) img.data[i] = img.data[i] > 110 ? 255 : 0;
    ctx.putImageData(img, 0, 0);
    emojiCache[key] = cv.toDataURL();
  }
  return `<img class="pxi" src="${emojiCache[key]}" width="${show}" height="${show}" alt="">`;
}

// Ship pixels, nose UP, as a 2D array of colors (null = empty). Pirates have no sprite yet,
// so their old outline shape is turned into pixels instead.
const SHAPES = {
  corvette: 'M120 50 L60 30 L18 34 L34 50 L18 66 L60 70 Z',
  destroyer: 'M140 50 L95 28 L20 30 L20 70 L95 72 Z',
  cruiser: 'M170 50 L130 24 L20 26 L36 50 L20 74 L130 76 Z',
  battleship: 'M200 42 L200 58 L170 80 L16 80 L30 58 L30 42 L16 20 L170 20 Z',
};
function shipPixels(type, def, color) {
  const sp = SPRITES[type];
  if (sp) return sp.rows.map((r) => [...r.padEnd(sp.w, '.')].map((c) => PALETTE[c] || null));
  // Rasterize the right-pointing outline at 1/5 size, then turn it nose-up.
  const W = 42, H = 20;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.scale(0.2, 0.2);
  ctx.fill(new Path2D(SHAPES[def.class]));
  const a = ctx.getImageData(0, 0, W, H).data;
  const on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && a[(y * W + x) * 4 + 3] > 120;
  let minX = W, maxX = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (on(x, y)) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); }
  const out = [];
  for (let x = maxX; x >= minX; x--) {
    const row = [];
    for (let y = 0; y < H; y++) {
      if (!on(x, y)) { row.push(null); continue; }
      const edge = !on(x + 1, y) || !on(x - 1, y) || !on(x, y + 1) || !on(x, y - 1);
      row.push(edge ? color : '#3d424d');
    }
    out.push(row);
  }
  return out;
}

// Ship nose-up as a crisp image, `scale` screen pixels per ship pixel.
function shipImage(px, scale) {
  const h = px.length, w = px[0].length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  px.forEach((row, y) => row.forEach((c, x) => { if (c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); } }));
  return `<img class="ship pxi" src="${cv.toDataURL()}" width="${w * scale}" height="${h * scale}" alt="">`;
}

// Small seeded random numbers, so each ship's starfield stays the same every time.
function rng(str) {
  let s = [...str].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// Header scene: a low-res canvas (one canvas pixel = one art pixel) with dithered nebula,
// stars, a planet, the ship flying right, and squadrons for carriers.
const ART_W = 104, ART_H = 48;
function art(type, def, color) {
  const r = rng(type);
  const cv = document.createElement('canvas');
  cv.width = ART_W; cv.height = ART_H;
  const ctx = cv.getContext('2d');
  const dot = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); };
  ctx.fillStyle = '#060a16';
  ctx.fillRect(0, 0, ART_W, ART_H);
  // Nebula: two dithered layers of the faction color, thicker near its center.
  const nx = 18 + r() * 20, ny = ART_H * (0.55 + r() * 0.3);
  for (let y = 0; y < ART_H; y++) for (let x = 0; x < ART_W; x++) {
    const d = Math.hypot((x - nx) / 1.8, y - ny) / 22;
    if (d < 0.55 && (x + y) % 2 === 0) dot(x, y, color + '55');
    else if (d < 1 && (x % 2 === 0) && (y % 2 === 0)) dot(x, y, color + '33');
  }
  // Stars: mostly single pixels, a few twinkling crosses.
  for (let i = 0; i < 34; i++) {
    const x = Math.floor(r() * ART_W), y = Math.floor(r() * ART_H);
    dot(x, y, r() < 0.5 ? '#ffffff' : '#7d93b8');
  }
  for (let i = 0; i < 3; i++) {
    const x = 4 + Math.floor(r() * (ART_W - 8)), y = 3 + Math.floor(r() * (ART_H - 6));
    [[0, 0, '#fff'], [1, 0, '#7d93b8'], [-1, 0, '#7d93b8'], [0, 1, '#7d93b8'], [0, -1, '#7d93b8']].forEach(([dx, dy, c]) => dot(x + dx, y + dy, c));
  }
  // Planet in the lower right: lit side, dithered terminator, dark side, and a rim.
  const pr = 14, pcx = ART_W - 10, pcy = ART_H + 5;
  for (let y = pcy - pr; y < ART_H; y++) for (let x = pcx - pr; x <= pcx + pr; x++) {
    const d = Math.hypot(x - pcx, y - pcy);
    if (d > pr) continue;
    const lit = ((x - pcx) * -0.7 + (y - pcy) * -0.7) / pr; // toward the upper left
    let c = '#2b1f3f';
    if (lit > 0.35) c = '#4a3570';
    else if (lit > 0.1) c = (x + y) % 2 ? '#4a3570' : '#2b1f3f';
    if (d > pr - 1 && lit > 0) c = '#6c55a0';
    dot(x, y, c);
  }
  // Ship, turned to fly right, centered.
  const px = shipPixels(type, def, color);
  const len = px.length, wid = px[0].length;
  const x0 = Math.round((ART_W - len) / 2) - 4, y0 = Math.round((ART_H - wid) / 2);
  // Engine trail behind the ship.
  const mid = y0 + Math.floor(wid / 2);
  const [hot, warm] = def.faction === 'djnzuar' ? ['#ff9be0', '#ff2eb8'] : ['#ffd43b', '#ff922b'];
  for (let i = 1; i <= 10; i++) if (i < 4 || i % 2) dot(x0 - i, mid, i < 4 ? hot : warm + '88'), dot(x0 - i, mid - 1, i < 3 ? warm : warm + '44');
  px.forEach((row, uy) => row.forEach((c, ux) => { if (c) dot(x0 + (len - 1 - uy), y0 + ux, c); }));
  // Carrier squadrons flying ahead.
  if (def.squadrons) {
    const sq = Object.keys(SQUADRONS).find((t) => SQUADRONS[t].faction === def.faction && SPRITES[t] && (!def.carries || def.carries.includes(t)));
    const s = sq && SPRITES[sq];
    if (s) {
      const spots = [[10, -14], [16, -8], [18, 6], [12, 12]];
      for (let n = 0; n < Math.min(def.squadrons, spots.length); n++) {
        const bx = x0 + len + spots[n][0] - 8, by = mid + spots[n][1];
        s.rows.forEach((row, uy) => [...row].forEach((ch, ux) => { const c = PALETTE[ch]; if (c) dot(bx + (s.h - 1 - uy), by + ux, c); }));
      }
    }
  }
  return `<img class="scene pxi" src="${cv.toDataURL()}" alt="">`;
}

// ---------- Card parts ----------

const reach = (r) => `<span class="reach">${RANGE_BANDS.map((_, i) => `<i class="${i <= BAND[r] ? 'on' : ''}"></i>`).join('')}</span>`;
function keywords(wd) {
  const k = [];
  if (wd.pd) k.push('PD');
  if (wd.once) k.push('Once');
  if (wd.critOn) k.push(`Crits ${wd.critOn}+`);
  const fx = { ion: 'Ion', acid: 'Acid', grapple: 'Grapple', disrupt: 'Disrupt', board: 'Boarding' }[wd.effect];
  if (fx) k.push(fx);
  return k;
}

function weaponRow(id, shots) {
  const wd = WEAPONS[id];
  const kw = keywords(wd);
  return `<tr class="${wd.pd ? 'pd' : ''}">
    <td class="name">${esc(wd.name)}${kw.length ? `<br>${kw.map((x) => `<span class="kw">${esc(x)}</span>`).join('')}` : ''}</td>
    <td>${arcIcon(wd.arc)}</td>
    <td>${reach(wd.reach)}</td>
    <td class="dmg ${wd.effect === 'ion' ? 'ion' : ''}">${wd.effect === 'ion' ? ION : wd.damage}×${shots}</td>
    <td><span class="pill">${wd.pd ? 'FREE' : wd.power}</span></td>
  </tr>`;
}

// Weapon notes for the legend: the effects this ship's weapons have.
function legend(def) {
  const ids = [...new Set([...def.weapons, ...def.pd.map((p) => p.weapon)])];
  const notes = ids.filter((id) => WEAPONS[id].effect || WEAPONS[id].once || WEAPONS[id].critOn || WEAPONS[id].pd)
    .map((id) => `<b>${esc(WEAPONS[id].name)}:</b> ${esc(WEAPONS[id].desc)}`);
  return `<b>Dmg</b> 1×3 = 3 shots, 1 damage each. <b>Reach</b> ■□□ Close · ■■□ Medium · ■■■ Long.${notes.length ? `<br>${notes.join('<br>')}` : ''}`;
}

function maneuver(def) {
  const [lo, hi] = def.speed;
  const speeds = [];
  for (let s = lo; s <= hi; s++) speeds.push(s);
  const clicksAt = (s) => def.clicksAtSpeed?.[s] ?? def.clicks;
  let rows = '';
  for (let seg = 1; seg <= hi; seg++) {
    rows += `<tr><th>S${seg}</th>${speeds.map((s) => (seg <= s ? `<td class="on">${clicksAt(s)}</td>` : '<td class="off"></td>')).join('')}</tr>`;
  }
  return `<table><thead><tr><th></th>${speeds.map((s) => `<th>${s}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Columns = speed. Rows = 2u segments. Numbers = turn clicks (15° each).</div>`;
}

function shipStanceIds(type, def) {
  return STANCE_ORDER.filter((s) => s !== 'balanced' && !STANCES[s].captain
    && (!STANCES[s].carrierOnly || def.squadrons) && (!STANCES[s].ships || STANCES[s].ships.includes(type)));
}

function card(type) {
  const def = SHIPS[type];
  const f = FACTIONS[def.faction];
  const cls = CLASSES[def.class];
  const sh = def.shields;
  const zone = (z, label) => `<div class="sb px z-${z} ${sh[z] ? '' : 'zero'}">${sh[z]}<span>${label}</span></div>`;
  const abilities = [];
  if (def.squadrons) {
    const types = Object.keys(SQUADRONS).filter((t) => SQUADRONS[t].faction === def.faction && (!def.carries || def.carries.includes(t)));
    abilities.push({ icon: '✈', name: `Carrier (${def.squadrons})`, text: `Carries ${def.squadrons} squadrons: ${types.map((t) => SQUADRONS[t].name).join(', ')}. Each launches or returns on its own order.` });
  }
  if (def.special) {
    const sp = SPECIALS[def.special];
    abilities.push({ icon: sp.icon, name: sp.name, text: sp.desc });
  }
  const traits = TRAITS[def.faction](def).map((t) => ({ ...t, faction: true }));
  const r = def.ratings || {};
  const px = shipPixels(type, def, f.color);
  return `<article class="card px" id="${type}" style="--fc:${f.color}">
    <div class="art">${art(type, def, f.color)}
      <div class="faction px">${badge(def.faction, 1)}${esc(f.short)}</div>
      <div class="cost px">${def.cost}<small>PTS</small></div></div>
    <div class="titlebar px">
      <div class="emblem">${badge(def.faction, 2)}</div>
      <div><h2>${esc(def.name)}</h2><div class="class">${esc(cls.name)}</div></div>
    </div>
    <div class="body">
      <div class="stats">
        <div class="stat power px"><span class="k">Power</span><span class="v">${BOLT}${def.power}</span></div>
        <div class="stat px"><span class="k">Agility</span><span class="v">${cls.agility}</span></div>
        <div class="stat px"><span class="k">Speed</span><span class="v">${def.speed[0]}-${def.speed[1]}</span></div>
      </div>
      <div class="row2">
        <div class="panel px">
          <h3>Shields &amp; Hull</h3>
          <div class="zones">
            ${zone('front', 'F')}${zone('left', 'L')}
            ${shipImage(px, Math.max(px.length, px[0].length) > 24 ? 2 : 3)}
            ${zone('right', 'R')}${zone('rear', 'REAR')}
          </div>
          <div class="hull"><div class="num">${def.hull}</div><div><div class="label">Hull</div><div class="pips">${'<i class="pip"></i>'.repeat(def.hull)}</div></div></div>
        </div>
        <div class="panel px maneuver"><h3>Maneuver</h3>${maneuver(def)}</div>
      </div>
      <div class="panel px weapons">
        <div class="head"><h3>Weapons</h3><small>Hits on <b>${HIT.base}+</b> · <b>${HIT.critOn}</b> = crit</small></div>
        <table>
          <tr><th>Weapon</th><th>Arc</th><th>Reach</th><th>Dmg</th><th>${BOLT}</th></tr>
          ${def.weapons.map((id) => weaponRow(id, WEAPONS[id].shots)).join('')}
          ${def.pd.map((p) => weaponRow(p.weapon, p.shots)).join('')}
        </table>
        <div class="legend">${legend(def)}</div>
      </div>
      <div class="panel px">
        ${abilities.length + traits.length ? '<h3>Special Abilities</h3>' : ''}
        ${[...abilities, ...traits].map((a) => `<div class="ability"><div class="icon px">${pxEmoji(a.icon, 24, 12)}</div><p><strong>${esc(a.name)}</strong>${a.faction ? '<span class="tag">Faction</span>' : ''} ${esc(a.text)}</p></div>`).join('')}
        <h3 style="${abilities.length + traits.length ? 'margin-top:8px' : ''}">Stances</h3>
        <div class="stances">${shipStanceIds(type, def).map((s) => `<span class="stance px">${pxEmoji(STANCES[s].icon, 20, 10)}${esc(STANCES[s].name)}</span>`).join('')}</div>
      </div>
    </div>
    <div class="footer"><i>"${esc(def.desc)}"</i>
      <span class="ratings">${[['O', r.o], ['D', r.d], ['M', r.m], ['U', r.u]].filter(([, v]) => v).map(([k, v]) => `<span>${k}<b>${v}</b></span>`).join('')}</span></div>
  </article>`;
}

let filter = 'all';
function render() {
  const main = document.getElementById('cards');
  main.innerHTML = FACTION_ORDER.filter((fid) => filter === 'all' || filter === fid).map((fid) => {
    const types = Object.keys(SHIPS).filter((t) => SHIPS[t].faction === fid).sort((a, b) => SHIPS[a].cost - SHIPS[b].cost);
    return `<h2 class="faction-title" style="color:${FACTIONS[fid].color}">${badge(fid, 2)}${esc(FACTIONS[fid].name)}<small>${esc(FACTIONS[fid].blurb)}</small></h2>
      <div class="grid">${types.map(card).join('')}</div>`;
  }).join('');
  document.getElementById('filters').innerHTML = ['all', ...FACTION_ORDER].map((f) =>
    `<button data-f="${f}" class="px ${f === filter ? 'on' : ''}">${f === 'all' ? 'All' : `${badge(f, 1)}${esc(FACTIONS[f].short)}`}</button>`).join('');
}
document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  filter = b.dataset.f;
  render();
});
document.getElementById('title').insertAdjacentHTML('afterbegin', badge('protectorate', 2));
render();
// Jump to a ship when the link has #shipType (e.g. from the phone's shipyard).
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
