<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Battles Ship Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --card: #0c1322;
    --panel: #101a2e;
    --panel-edge: #2a4a78;
    --grid: rgba(80, 150, 255, 0.08);
    --text: #dce8ff;
    --muted: #7d93b8;
    --accent: #5cc8ff;
    --gold: #f2c14e;
    --hull: #e0574f;
    --shield: #5cc8ff;
    --good: #6fdc8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #13203a, var(--bg) 60%) fixed var(--bg);
    font-family: 'Rajdhani', system-ui, sans-serif; color: var(--text); padding: 20px 16px 40px;
  }
  header { max-width: 1400px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 22px; letter-spacing: 1px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button {
    font: inherit; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    padding: 6px 12px; border-radius: 999px; border: 2px solid var(--panel-edge); background: var(--panel); color: var(--text); cursor: pointer;
  }
  .filters button.on { border-color: var(--gold); color: var(--gold); }

  .faction-title { max-width: 1400px; margin: 24px auto 10px; font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
  .faction-title small { font-family: 'Rajdhani', sans-serif; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 14px; margin-left: 8px; }
  .grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 20px; align-items: start; }

  .card {
    --fc: var(--accent);
    background: var(--card); border: 3px solid var(--panel-edge); border-radius: 18px; overflow: hidden;
    box-shadow: 0 0 0 2px #000, 0 20px 60px rgba(0,0,0,.5), inset 0 0 40px rgba(92,200,255,.06);
    scroll-margin-top: 16px;
  }
  .card:target { border-color: var(--gold); }
  .art { position: relative; height: 150px; background: radial-gradient(circle at 80% 30%, rgba(255,140,60,.3), transparent 40%), radial-gradient(circle at 15% 80%, color-mix(in srgb, var(--fc) 30%, transparent), transparent 45%), linear-gradient(160deg, #0a1328, #050810); }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .faction { position: absolute; top: 10px; left: 10px; padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; letter-spacing: 1px; background: rgba(5,10,20,.75); border: 1px solid var(--fc); color: var(--fc); text-transform: uppercase; }
  .cost { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; border-radius: 50%; background: #0b1222; border: 2px solid var(--gold); display: grid; place-items: center; text-align: center; line-height: 1; font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 18px; color: var(--gold); }
  .cost small { display: block; font-size: 8px; font-weight: 600; letter-spacing: .5px; }
  .titlebar { display: flex; align-items: center; gap: 10px; margin: -18px 12px 0; position: relative; background: linear-gradient(#f4f6fb, #c9d2e3); border: 2px solid #0b1222; border-radius: 10px; padding: 6px 12px; color: #0b1222; }
  .emblem { width: 30px; height: 30px; flex: none; border-radius: 50%; background: #0b1222; display: grid; place-items: center; }
  .titlebar h2 { margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 19px; font-style: italic; letter-spacing: .5px; line-height: 1.1; }
  .titlebar .class { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #3a4d70; }

  .body { padding: 12px; display: grid; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 400px) { .row2 { grid-template-columns: 1fr; } }
  .panel { background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 12px 12px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 12px 12px, var(--panel); border: 2px solid var(--panel-edge); border-radius: 10px; padding: 8px 10px; }
  .panel h3 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 10px; padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .stat .k { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 17px; }
  .stat.power { border-color: var(--gold); }
  .stat.power .v { color: var(--gold); }

  .zones { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; gap: 2px; }
  .zones .ship { grid-column: 2; grid-row: 2; }
  .sb { display: flex; align-items: center; gap: 4px; background: #08101f; border: 1.5px solid var(--shield); border-radius: 14px; padding: 1px 8px; font-weight: 700; font-size: 15px; color: var(--shield); }
  .sb.zero { border-color: #3c4c6a; color: #3c4c6a; }
  .sb span { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .z-front { grid-column: 2; grid-row: 1; } .z-left { grid-column: 1; grid-row: 2; } .z-right { grid-column: 3; grid-row: 2; } .z-rear { grid-column: 2; grid-row: 3; }
  .hull { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .hull .num { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 22px; color: var(--hull); min-width: 30px; text-align: center; }
  .hull .label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .pips { display: flex; flex-wrap: wrap; gap: 3px; }
  .pip { width: 8px; height: 12px; border-radius: 2px; background: var(--hull); box-shadow: 0 0 4px rgba(224,87,79,.6); }

  .maneuver table { border-collapse: separate; border-spacing: 3px; width: 100%; }
  .maneuver th { font-size: 11px; color: var(--muted); font-weight: 700; }
  .maneuver thead th { font-family: 'Orbitron', sans-serif; font-size: 13px; color: var(--text); }
  .maneuver td { height: 22px; text-align: center; border-radius: 4px; font-weight: 700; font-size: 15px; }
  .maneuver td.on { background: #0e2a1e; border: 1.5px solid var(--good); color: var(--good); }
  .maneuver td.off { background: rgba(255,255,255,.03); border: 1.5px dashed rgba(255,255,255,.08); }
  .maneuver .note { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.25; }

  .weapons .head { display: flex; justify-content: space-between; align-items: baseline; }
  .weapons .head small { font-size: 12px; color: var(--muted); }
  .weapons .head small b { color: var(--text); }
  .weapons table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .weapons th { font-size: 10px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; font-weight: 700; text-align: center; padding: 0 2px 3px; }
  .weapons th:first-child { text-align: left; }
  .weapons td { padding: 4px 2px; text-align: center; border-top: 1px solid rgba(92,200,255,.12); vertical-align: middle; }
  .weapons td.name { text-align: left; font-weight: 700; line-height: 1.1; }
  .kw { display: inline-block; margin: 2px 3px 0 0; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 0 5px; border-radius: 4px; color: var(--shield); border: 1px solid var(--shield); }
  .arc { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .arc svg { width: 20px; height: 20px; flex: none; }
  .reach { display: inline-flex; gap: 3px; }
  .reach i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--accent); }
  .reach i.on { background: var(--accent); }
  .dmg { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .dmg.ion { color: var(--shield); }
  .pill { display: inline-block; min-width: 30px; font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 14px; color: #0b1222; background: var(--gold); border-radius: 12px; padding: 1px 6px; }
  tr.pd td { color: var(--muted); }
  tr.pd .pill { background: transparent; color: var(--good); border: 1px solid var(--good); font-size: 10px; letter-spacing: 1px; }
  .legend { margin-top: 6px; font-size: 11px; color: var(--muted); line-height: 1.3; }

  .ability { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
  .ability + .ability { border-top: 1px solid rgba(92,200,255,.12); }
  .ability .icon { flex: none; width: 26px; height: 26px; border-radius: 6px; background: #0b1730; border: 1.5px solid var(--gold); display: grid; place-items: center; font-size: 14px; }
  .ability p { margin: 0; font-size: 14px; line-height: 1.25; }
  .ability strong { color: var(--gold); }
  .ability .tag { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-left: 4px; }
  .stances { display: flex; flex-wrap: wrap; gap: 4px; }
  .stance { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; background: #0b1730; border: 1px solid var(--panel-edge); }
  .footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 14px 12px; font-size: 13px; color: var(--muted); }
  .footer i { font-style: italic; }
  .ratings { display: flex; gap: 6px; flex: none; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
  .ratings span b { color: var(--text); }
</style>
</head>
<body>
<header>
  <div>
    <h1>🚀 Space Battles · Ship Cards</h1>
    <p>Every ship in the game, straight from the game's own data.</p>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="cards"><p style="text-align:center;color:var(--muted)">Loading…</p></main>

<!-- Arc icons: ship points up. Battery = 270°, Spinal = 30° ahead, Turret = 360°. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="arc-battery"><circle cx="11" cy="11" r="9" fill="none" stroke="#2a4a78" stroke-width="1"/><path d="M11 11 L17.36 17.36 A9 9 0 1 0 4.64 17.36 Z" fill="rgba(92,200,255,.35)" stroke="#5cc8ff" stroke-width="1.2"/><path d="M11 8 L13 13 L9 13 Z" fill="#fff"/></g>
    <g id="arc-spinal"><circle cx="11" cy="11" r="9" fill="none" stroke="#2a4a78" stroke-width="1"/><path d="M11 11 L8.67 2.31 A9 9 0 0 1 13.33 2.31 Z" fill="rgba(242,193,78,.6)" stroke="#f2c14e" stroke-width="1.2"/><path d="M11 8 L13 13 L9 13 Z" fill="#fff"/></g>
    <g id="arc-turret"><circle cx="11" cy="11" r="9" fill="rgba(111,220,140,.25)" stroke="#6fdc8c" stroke-width="1.2"/><path d="M11 8 L13 13 L9 13 Z" fill="#fff"/></g>
  </defs>
</svg>

<script type="module">
import {
  FACTIONS, FACTION_ORDER, SHIPS, WEAPONS, CLASSES, RANGE_BANDS, ARC_DEFS, HIT, SPECIALS, SQUADRONS,
  STANCES, CLASS_STANCES,
} from '../js/games/space-battles/data.js';

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BAND = Object.fromEntries(RANGE_BANDS.map((b, i) => [b.id, i]));

// Faction traits shown on every ship of that faction.
const TRAITS = {
  protectorate: (def) => [
    { icon: '↻', name: 'Trained Helms', text: '+1 extra turn click when using Maneuvering Thrusters or Full Burn.' },
    ...(def.squadrons ? [{ icon: '🔧', name: 'Hangar Repair', text: 'Squadrons docked here restore 1 hull at the end of each round.' }] : []),
  ],
  djnzuar: () => [
    { icon: '💥', name: 'Ramming', text: 'Colliding with an enemy ship deals it 3 damage; this ship takes 1.' },
    { icon: '🔧', name: 'Samurai Engineers', text: 'Damage Control restores 3 shields or 1 hull, and also removes 1 critical.' },
  ],
  pirates: () => [
    { icon: '🚀', name: 'Every Ship Is Home', text: 'The first time it drops to half hull, it gets a free Full Burn move next round.' },
  ],
};

// A simple top-down silhouette per class, pointing right, in the faction color.
const SHAPES = {
  corvette: 'M120 50 L60 30 L18 34 L34 50 L18 66 L60 70 Z',
  destroyer: 'M140 50 L95 28 L20 30 L20 70 L95 72 Z',
  cruiser: 'M170 50 L130 24 L20 26 L36 50 L20 74 L130 76 Z',
  battleship: 'M200 42 L200 58 L170 80 L16 80 L30 58 L30 42 L16 20 L170 20 Z',
};
function art(def, color) {
  const w = { corvette: 120, destroyer: 140, cruiser: 170, battleship: 200 }[def.class];
  const ox = 220 - w / 2, oy = 25;
  const stars = Array.from({ length: 14 }, (_, i) => `<circle cx="${(i * 97) % 440}" cy="${(i * 53) % 150}" r="${i % 3 ? 0.8 : 1.2}"/>`).join('');
  const wing = def.squadrons ? Array.from({ length: def.squadrons }, (_, i) => `<path d="M${350 + i * 16} ${40 + (i % 2) * 14} l9 3 -9 3 2 -3z"/>`).join('') : '';
  return `<svg viewBox="0 0 440 150" aria-hidden="true">
    <g fill="#fff" opacity=".6">${stars}</g>
    <circle cx="395" cy="160" r="60" fill="#2b1f3f"/>
    <g transform="translate(${ox} ${oy})">
      <ellipse cx="14" cy="50" rx="22" ry="10" fill="${color}" opacity=".35"/>
      <path d="${SHAPES[def.class]}" fill="${color}33" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>
      <path d="${SHAPES[def.class]}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1" transform="translate(${w * 0.08} 10) scale(.84 .8)"/>
    </g>
    <g fill="#f2c14e">${wing}</g>
  </svg>`;
}

const arcIcon = (arc) => `<span class="arc"><svg viewBox="0 0 22 22"><use href="#arc-${arc}"/></svg>${ARC_DEFS[arc].name}</span>`;
const reach = (r) => `<span class="reach">${RANGE_BANDS.map((_, i) => `<i class="${i <= BAND[r] ? 'on' : ''}"></i>`).join('')}</span>`;
function keywords(wd) {
  const k = [];
  if (wd.pd) k.push('PD');
  if (wd.once) k.push('Once');
  if (wd.critOn) k.push(`Crits ${wd.critOn}+`);
  const fx = { ion: 'Ion', acid: 'Acid', grapple: 'Grapple', disrupt: 'Disrupt', board: 'Boarding' }[wd.effect];
  if (fx) k.push(fx);
  return k;
}

function weaponRow(id, shots) {
  const wd = WEAPONS[id];
  const kw = keywords(wd);
  return `<tr class="${wd.pd ? 'pd' : ''}">
    <td class="name">${esc(wd.name)}${kw.length ? `<br>${kw.map((x) => `<span class="kw">${esc(x)}</span>`).join('')}` : ''}</td>
    <td>${arcIcon(wd.arc)}</td>
    <td>${reach(wd.reach)}</td>
    <td class="dmg ${wd.effect === 'ion' ? 'ion' : ''}">${wd.effect === 'ion' ? '⛨' : wd.damage}×${shots}</td>
    <td><span class="pill">${wd.pd ? 'FREE' : wd.power}</span></td>
  </tr>`;
}

// Weapon notes for the legend: the effects this ship's weapons have.
function legend(def) {
  const ids = [...new Set([...def.weapons, ...def.pd.map((p) => p.weapon)])];
  const notes = ids.filter((id) => WEAPONS[id].effect || WEAPONS[id].once || WEAPONS[id].critOn || WEAPONS[id].pd)
    .map((id) => `<b>${esc(WEAPONS[id].name)}:</b> ${esc(WEAPONS[id].desc)}`);
  return `<b>Dmg</b> 1×3 = 3 shots, 1 damage each. <b>Reach</b> ●○○ Close · ●●○ Medium · ●●● Long.${notes.length ? `<br>${notes.join('<br>')}` : ''}`;
}

function maneuver(def) {
  const [lo, hi] = def.speed;
  const speeds = [];
  for (let s = lo; s <= hi; s++) speeds.push(s);
  const clicksAt = (s) => def.clicksAtSpeed?.[s] ?? def.clicks;
  let rows = '';
  for (let seg = 1; seg <= hi; seg++) {
    rows += `<tr><th>S${seg}</th>${speeds.map((s) => (seg <= s ? `<td class="on">${clicksAt(s)}</td>` : '<td class="off"></td>')).join('')}</tr>`;
  }
  return `<table><thead><tr><th></th>${speeds.map((s) => `<th>${s}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Columns = speed. Rows = 2u segments. Numbers = turn clicks (15° each).</div>`;
}

function card(type) {
  const def = SHIPS[type];
  const f = FACTIONS[def.faction];
  const cls = CLASSES[def.class];
  const sh = def.shields;
  const badge = (z, label) => `<div class="sb z-${z} ${sh[z] ? '' : 'zero'}">${sh[z]} <span>${label}</span></div>`;
  const abilities = [];
  if (def.squadrons) {
    const types = Object.keys(SQUADRONS).filter((t) => SQUADRONS[t].faction === def.faction && (!def.carries || def.carries.includes(t)));
    abilities.push({ icon: '✈', name: `Carrier (${def.squadrons})`, text: `Carries ${def.squadrons} squadrons: ${types.map((t) => SQUADRONS[t].name).join(', ')}. Each launches or returns on its own order.` });
  }
  if (def.special) {
    const sp = SPECIALS[def.special];
    abilities.push({ icon: sp.icon, name: sp.name, text: sp.desc });
  }
  const traits = TRAITS[def.faction](def).map((t) => ({ ...t, faction: true }));
  const r = def.ratings || {};
  return `<article class="card" id="${type}" style="--fc:${f.color}">
    <div class="art">${art(def, f.color)}<div class="faction">${esc(f.short)}</div><div class="cost">${def.cost}<small>PTS</small></div></div>
    <div class="titlebar">
      <div class="emblem"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 1 L18 5 V11 C18 15 14 18 10 19 C6 18 2 15 2 11 V5 Z" fill="none" stroke="${f.color}" stroke-width="2"/><path d="M10 5 V15 M6 9 H14" stroke="#f2c14e" stroke-width="2"/></svg></div>
      <div><h2>${esc(def.name)}</h2><div class="class">${esc(cls.name)}</div></div>
    </div>
    <div class="body">
      <div class="stats">
        <div class="stat power"><span class="k">Power</span><span class="v">⚡${def.power}</span></div>
        <div class="stat"><span class="k">Agility</span><span class="v">${cls.agility}</span></div>
        <div class="stat"><span class="k">Speed</span><span class="v">${def.speed[0]}–${def.speed[1]}</span></div>
      </div>
      <div class="row2">
        <div class="panel">
          <h3>Shields &amp; Hull</h3>
          <div class="zones">
            ${badge('front', 'F')}${badge('left', 'L')}
            <svg class="ship" width="40" height="58" viewBox="0 0 44 64"><path d="M22 2 L36 26 L34 56 L22 62 L10 56 L8 26 Z" fill="${f.color}33" stroke="${f.color}" stroke-width="2"/></svg>
            ${badge('right', 'R')}${badge('rear', 'REAR')}
          </div>
          <div class="hull"><div class="num">${def.hull}</div><div><div class="label">Hull</div><div class="pips">${'<i class="pip"></i>'.repeat(def.hull)}</div></div></div>
        </div>
        <div class="panel maneuver"><h3>Maneuver</h3>${maneuver(def)}</div>
      </div>
      <div class="panel weapons">
        <div class="head"><h3>Weapons</h3><small>Hits on <b>${HIT.base}+</b> · <b>${HIT.critOn}</b> = crit</small></div>
        <table>
          <tr><th>Weapon</th><th>Arc</th><th>Reach</th><th>Dmg</th><th>⚡</th></tr>
          ${def.weapons.map((id) => weaponRow(id, WEAPONS[id].shots)).join('')}
          ${def.pd.map((p) => weaponRow(p.weapon, p.shots)).join('')}
        </table>
        <div class="legend">${legend(def)}</div>
      </div>
      <div class="panel">
        <h3>Special Abilities</h3>
        ${[...abilities, ...traits].map((a) => `<div class="ability"><div class="icon">${a.icon}</div><p><strong>${esc(a.name)}</strong>${a.faction ? '<span class="tag">Faction</span>' : ''} ${esc(a.text)}</p></div>`).join('')}
        <h3 style="margin-top:8px">Stances</h3>
        <div class="stances">${(CLASS_STANCES[def.class] || []).map((s) => `<span class="stance">${STANCES[s].icon} ${esc(STANCES[s].name)}</span>`).join('')}</div>
      </div>
    </div>
    <div class="footer"><i>"${esc(def.desc)}"</i>
      <span class="ratings">${[['O', r.o], ['D', r.d], ['M', r.m], ['U', r.u]].filter(([, v]) => v).map(([k, v]) => `<span>${k}<b>${v}</b></span>`).join('')}</span></div>
  </article>`;
}

let filter = 'all';
function render() {
  const main = document.getElementById('cards');
  main.innerHTML = FACTION_ORDER.filter((fid) => filter === 'all' || filter === fid).map((fid) => {
    const types = Object.keys(SHIPS).filter((t) => SHIPS[t].faction === fid).sort((a, b) => SHIPS[a].cost - SHIPS[b].cost);
    return `<h2 class="faction-title" style="color:${FACTIONS[fid].color}">${esc(FACTIONS[fid].name)}<small>${esc(FACTIONS[fid].blurb)}</small></h2>
      <div class="grid">${types.map(card).join('')}</div>`;
  }).join('');
  document.getElementById('filters').innerHTML = ['all', ...FACTION_ORDER].map((f) =>
    `<button data-f="${f}" class="${f === filter ? 'on' : ''}">${f === 'all' ? 'All' : esc(FACTIONS[f].short)}</button>`).join('');
}
document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  filter = b.dataset.f;
  render();
});
render();
// Jump to a ship when the link has #shipType (e.g. from the phone's shipyard).
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
